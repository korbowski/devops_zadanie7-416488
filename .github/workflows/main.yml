jobs:
  # Job 1: Testy jednostkowe
  unit_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        # Zakładamy, że requirements.txt i testy są w folderze 'main'
        working-directory: ./main
        run: pip install -r requirements.txt
      
      # Zakładam, że masz osobny plik dla testów jednostkowych, np. test_unit.py
      # Jeśli Twoje jedyne testy to app_test.py, ten job może być uproszczony lub połączony
      - name: Run unit tests
        working-directory: ./main
        run: pytest # pytest automatycznie znajdzie pliki test_*.py lub *_test.py

  # Job 2: Testy funkcjonalne (z diagnostyką)
  functional_test:
    # 2. Uruchamianie po unit_test
    needs: unit_test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: ./main
        run: pip install -r requirements.txt

      # Uruchamiamy aplikację w tle i ZAPISUJEMY jej logi
      - name: Run application in background and capture logs
        working-directory: ./main
        run: |
          python app.py > app_log.txt 2>&1 &
          sleep 5 # Czekamy chwilę na start aplikacji

      # WYŚWIETLAMY logi aplikacji, aby zobaczyć, czy nie było błędu przy starcie
      - name: Display application logs
        working-directory: ./main
        # 'continue-on-error' sprawi, że workflow pójdzie dalej, nawet jeśli plik logów nie istnieje
        continue-on-error: true
        run: |
          echo "--- Contents of app_log.txt ---"
          cat app_log.txt
          echo "-------------------------------"

      # Sprawdzamy, czy proces faktycznie działa
      - name: Check running processes and ports
        run: |
          echo "--- Running Python processes ---"
          ps aux | grep python || echo "NO PYTHON PROCESS FOUND"
          echo "--- Listening ports ---"
          sudo lsof -i -P -n | grep LISTEN || echo "NO LISTENING PORTS FOUND"
      
      # Uruchamiamy testy funkcjonalne
      - name: Run functional tests
        working-directory: ./main
        run: pytest app_test.py

  # Job 3: Deployment do Docker Hub
  deployment:
    # 2. Uruchamianie po pomyślnych testach funkcjonalnych
    needs: functional_test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # 4. Logowanie do Docker Hub przy użyciu sekretów
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}

      # Budowanie i wypychanie obrazu Docker
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          # 3. Kontekst budowania to nasz folder roboczy
          context: ./main
          push: true
          # Nazwa obrazu: twoja_nazwa_uzytkownika/nazwa_repo:tag
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/devops-lato-2025-416488:latest