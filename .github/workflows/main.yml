name: workflow lab8

on:
  push:
    branches:
      - dev-416488

jobs:
  unit_test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v2
    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.11'
    - name: Install requirements
      run: |
        pip install -r requirements.txt
    - name: Run unit tests
      run: |
        pytest main/calculator_test.py

    functional_test:
    needs: unit_test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    # Zakładam, że plik jest w ./main
    - name: Install requirements
      working-directory: ./main 
      run: pip install -r requirements.txt

    # KROK 1: Uruchamiamy aplikację i ZAPISUJEMY jej logi do pliku
    - name: Run application in background and capture logs
      working-directory: ./main
      run: |
        # Uruchom apkę w tle i przekieruj jej logi (stdout i stderr) do pliku app_log.txt
        python app.py > app_log.txt 2>&1 &
        sleep 5 # Daj jej chwilę na start lub... na wygenerowanie błędu

    # KROK 2: WYŚWIETLAMY logi aplikacji. Jeśli są tam błędy, teraz je zobaczymy!
    - name: Display application logs
      working-directory: ./main
      run: |
        echo "--- Contents of app_log.txt ---"
        cat app_log.txt
        echo "-------------------------------"

    # KROK 3: Sprawdzamy, czy proces Pythona w ogóle działa i co nasłuchuje na portach
    - name: Check running processes and ports
      run: |
        echo "--- Running Python processes ---"
        ps aux | grep python || echo "NO PYTHON PROCESS FOUND"
        echo "--- Listening ports ---"
        sudo lsof -i -P -n | grep LISTEN || echo "NO LISTENING PORTS FOUND"

    # Krok 4: Uruchamiamy testy
    - name: Run functional tests
      working-directory: ./main
      run: pytest app_test.py

  deployment:
    needs: functional_test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v2
    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME_416488 }}
        password: ${{ secrets.DOCKERHUB_TOKEN_416488 }}
    - name: Debug list all
      run: |
        ls -l
    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./dockerfile
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME_416488 }}/devops-lato-2025-416488:latest